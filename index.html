    caps.parallel = gl.getExtension('KHR_parallel_shader_compile');
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    caps.renderer = String(gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
    caps.software = /swiftshader|llvmpipe|software/i.test(caps.renderer);
    caps.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    // HDR path needs a renderable half-float target that can be filtered; half
    // float is always filterable in WebGL2. Otherwise fall back to 8-bit.
    caps.hdr = caps.halfTarget && this._probeTarget(gl.RGBA16F, gl.HALF_FLOAT);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    return gl;
  },

  _probeTarget(internal, type) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, gl.RGBA, type, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(f); gl.deleteTexture(t);
    return ok;
  },

  // A colour target. hdr=true asks for half float and quietly gets 8-bit when
  // the device cannot render to it.
  target(w, h, { hdr = true, linear = true } = {}) {
    const gl = this.gl;
    const useHdr = hdr && this.caps.hdr;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, useHdr ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA,
      useHdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    const f = linear ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h, hdr: useHdr };
  },
  freeTarget(t) { if (!t) return; this.gl.deleteFramebuffer(t.fbo); this.gl.deleteTexture(t.tex); },

  // An 8-bit data texture that repeats.
  dataTexture(size, bytes, { linear = true } = {}) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const f = linear ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    return tex;
  },

  VS: `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`,

  // Starts a compile and returns at once. Poll with ready(); the link status is
  // only read after the driver reports completion, so nothing blocks the frame
  // where KHR_parallel_shader_compile exists.
  program(fsSource, label) {
    const gl = this.gl;
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const vs = mk(gl.VERTEX_SHADER, this.VS);
    const fs = mk(gl.FRAGMENT_SHADER, fsSource);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    return { prog, vs, fs, label, src: fsSource, state: 'compiling', started: performance.now(), uniforms: new Map(), error: null };
  },

  // -> 'compiling' | 'ready' | 'failed'
  ready(p) {
    if (p.state !== 'compiling') return p.state;
    const gl = this.gl;
    if (gl.isContextLost()) return p.state;
    const ext = this.caps.parallel;
    if (ext && !gl.getProgramParameter(p.prog, ext.COMPLETION_STATUS_KHR)) return p.state;
    if (gl.getProgramParameter(p.prog, gl.LINK_STATUS)) {
      p.state = 'ready';
      p.compileMs = performance.now() - p.started;
    } else {
      p.state = 'failed';
      p.error = (gl.getShaderInfoLog(p.fs) || '') + (gl.getProgramInfoLog(p.prog) || '');
      console.error('[shader] ' + p.label + ' failed\n' + GLX.annotate(p.src, p.error));
    }
    gl.deleteShader(p.vs); gl.deleteShader(p.fs);
    return p.state;
  },
  freeProgram(p) { if (p && p.prog) { this.gl.deleteProgram(p.prog); p.prog = null; p.state = 'freed'; } },

  // Shows the offending lines of the assembled source next to a driver error.
  annotate(src, log) {
    const lines = src.split('\n'); const seen = new Set(); let out = log.trim();
    for (const m of log.matchAll(/ERROR:\s*\d+:(\d+)/g)) {
      const n = +m[1]; if (seen.has(n)) continue; seen.add(n);
      out += `\n  ${n}: ${(lines[n - 1] || '').trim()}`;
      if (seen.size > 6) break;
    }
    return out;
  },

  use(p) { this.gl.useProgram(p.prog); this.cur = p; },
  loc(name) {
    const p = this.cur; let l = p.uniforms.get(name);
    if (l === undefined) { l = this.gl.getUniformLocation(p.prog, name); p.uniforms.set(name, l); }
    return l;
  },
  // Uniform setters that silently skip uniforms the compiler optimised away.
  f(name, x) { const l = this.loc(name); if (l) this.gl.uniform1f(l, x); },
  i(name, x) { const l = this.loc(name); if (l) this.gl.uniform1i(l, x); },
  v2(name, x, y) { const l = this.loc(name); if (l) this.gl.uniform2f(l, x, y); },
  v3(name, v) { const l = this.loc(name); if (l) this.gl.uniform3f(l, v[0], v[1], v[2]); },
  v4(name, a, b, c, d) { const l = this.loc(name); if (l) this.gl.uniform4f(l, a, b, c, d); },
  fv(name, arr) { const l = this.loc(name); if (l) this.gl.uniform1fv(l, arr); },
  v3v(name, arr) { const l = this.loc(name); if (l) this.gl.uniform3fv(l, arr); },
  tex(name, unit, tex) {
    const gl = this.gl, l = this.loc(name);
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
    if (l) gl.uniform1i(l, unit);
  },
  // Draw into a target (or the canvas when t is null), into the sub-rectangle w x h.
  draw(t, w, h, scissor) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
    gl.viewport(0, 0, w, h);
    if (scissor) { gl.enable(gl.SCISSOR_TEST); gl.scissor(scissor[0], scissor[1], scissor[2], scissor[3]); }
    else gl.disable(gl.SCISSOR_TEST);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (scissor) gl.disable(gl.SCISSOR_TEST);
  },
};

const INK_KEYS = ['top', 'low', 'glow', 'lit', 'shade', 'deep', 'paper', 'accent'];
const PALETTE_BY_NAME = Object.fromEntries(PALETTES.map((p) => [p.name, p]));

// ---- 30-world.js
// ---------- worlds ----------
// A world is a pure function of its key { base, change, heir, age }.
//   base    the place itself: its form, layout, set piece, event
//   change  0 for the place as first found; otherwise how this kin differs
//   heir    something handed down a line of worlds (a moon, a tune)
// Every trait draws from its own named stream, so new traits never disturb old ones.
const FORMS = {};
const WORLD = {
  formNames() { return Object.keys(FORMS); },

  pathAt(g, z) {
    const p = g.path;
    return [p.ax * Math.sin(z * p.fx + p.px), p.y0 + p.ay * Math.sin(z * p.fy + p.py)];
  },

  make(key) {
    const base = key.base >>> 0;
    const S = (label) => stream(base, label);
    const g = {
      key, form: null,
      tr: new Float32Array(16),
      path: { ax: 0, fx: 0, px: 0, ay: 0, fy: 0, py: 0, y0: 6 },
      speed: 14, lead: 60, tilt: 0, focal: 2.05,
      sunAz: 0.6, sunEl: 0.35, sun: [0.03, 1, 3, 9],
      air: [0.0016, 6, -100, 0], sea: [0, 0, 1, 0],
      set: { type: 0, pos: [0, 0, 0], scale: 10, yaw: 0, attend: 0.6, eye: 2.5, move: 0, lit: 0 },
      ev: { id: 0, type: 'none', t0: 22, dur: 16 },
      sky: [0.3, 1, 0, 0],
      body: new Float32Array(8), bodyK: new Float32Array(8),
      part: [0, 0, 0, 1],
      door: { r: 7, kin: [0, 0], stranger: [0, 0] }, doorsAt: 44,
      facts: {},
    };
    // 1. the place
    const formPick = S('form');
    const names = Object.keys(FORMS);
    g.form = key.form && FORMS[key.form] ? key.form : formPick.weighted(names.map((n) => [n, FORMS[n].weight || 1]));
    const F = FORMS[g.form];
    // 2. its inks and its hour
    const pr = S('ink');
    const pool = PALETTES.filter((p) => !F.hours || F.hours.includes(p.hour));
    g.pal = key.pal && PALETTE_BY_NAME[key.pal] ? PALETTE_BY_NAME[key.pal] : pr.pick(pool);
    WORLD.light(g, S('light'));
    // 3. the form lays out its ground, set piece and event
    F.build(g, S);
    // 4. kin: the same place, changed
    if (key.change) WORLD.change(g, key.change >>> 0);
    g.inks = g.pal;
    g.inkFlat = new Float32Array(24);
    INK_KEYS.forEach((k, i) => g.inkFlat.set(g.pal[k], i * 3));
    g.doorInk = V.mix(g.pal.glow, g.pal.low, 0.35);
    return g;
  },

  // Sun or moon, sky furniture, weather: decided from the palette's hour.
  light(g, r) {
    const hour = g.pal.hour;
    const side = r.chance(0.5) ? 1 : -1;
    if (hour === 1) { g.sunAz = side * r.range(0.12, 0.5); g.sunEl = r.range(0.05, 0.16); g.sun = [0.045, 1.6, 3, 10]; }
    else if (hour === 2) { g.sunAz = side * r.range(0.5, 1.1); g.sunEl = r.range(0.42, 0.85); g.sun = [0.026, 0.7, 3, 14]; }
    else { g.sunAz = side * r.range(0.25, 0.8); g.sunEl = r.range(0.3, 0.6); g.sun = [0.05, 0.9, 2, 12]; }
    g.sky = [r.chance(0.7) ? r.range(0.2, 0.75) : 0, r.range(0.7, 1.6), hour === 0 ? r.range(0.6, 1) : (hour === 1 ? r.range(0, 0.35) : 0), r.chance(0.55) ? r.range(0.03, 0.09) : 0];
    g.air = [r.range(0.0011, 0.0026), r.int(5, 8), -100, 0];
  },

  change(g, change) {
    // filled in with the kin transformations
    const r = stream(change, 'kind');
    const others = PALETTES.filter((p) => p !== g.pal);
    g.pal = r.pick(others);
    WORLD.light(g, stream(change, 'light'));
  },

  // What the world looks like at this moment of the visit. ta is seconds since
  // arrival (drives the event); t is the world's own running clock.
  live(g, ta, t) {
    const e = g.ev.type === 'none' ? 0 : smooth(0, 1, (ta - g.ev.t0) / g.ev.dur);
    const L = {
      ev: e, inks: g.inkFlat, tr: g.tr,
      sun: g.sun, air: g.air.slice(), sea: g.sea.slice(), sky: g.sky, body: g.body, bodyK: g.bodyK, part: g.part,
      set: g.set.pos, setMotion: g.set.move, setLit: g.set.lit,
    };
    let el = g.sunEl, az = g.sunAz;
    const ty = g.ev.type;
    if (ty === 'rise') { L.setMotion = e; L.setLit = e; }
    else if (ty === 'lights') { L.setLit = e; }
    else if (ty === 'tide') { L.sea[1] = g.sea[1] + g.ev.amount * e; }
    else if (ty === 'mist') { L.air[2] = mix(g.air[2], g.ev.amount, e); L.air[3] = mix(g.air[3], 0.03, e); }
    else if (ty === 'sunset') { el = mix(g.sunEl, -0.04, e); }
    L.sunDir = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
    return L;
  },
};

// ---- PLAIN ----
FORMS.plain = {
  weight: 1,
  build(g, S) {
    const r = S('plain');
    const kind = r.weighted([[1, 3], [2, 3], [3, 3], [4, 2], [5, 1.5]]);
    const spacing = r.range(26, 46);
    const H = { 1: r.range(9, 20), 2: r.range(3.5, 7), 3: r.range(6, 9), 4: r.range(7, 12), 5: r.range(3, 6) }[kind];
    const W = { 1: r.range(0.9, 1.6), 2: r.range(1.1, 1.9), 3: 1.0, 4: r.range(0.8, 1.1), 5: 1 }[kind];
    const odd = r.int(1, 4);
    const oz = Math.round((g.speed * r.range(16, 22)) / spacing), ox = r.chance(0.5) ? 0 : -1;
    g.tr.set([kind, spacing, H, kind === 2 ? 0.8 : r.range(0, 0.25), kind === 5 ? 0.45 : r.range(0.75, 1), ox, oz, odd, r.chance(0.3) ? r.range(2, 6) : 0, r.int(0, 2), W]);
    g.path.y0 = r.range(3.2, 6.5);
    g.speed = r.range(11, 16); g.lead = 70; g.tilt = -0.01;
    if (r.chance(0.6)) g.sea = [2, 0.03, r.range(0.35, 1), 0];
    g.door = { r: 5.5, kin: [0, 0.5], stranger: [spacing * 0.0 + 9, 7] };
    if (r.chance(0.55)) {
      const type = r.pick([1, 2, 3, 4, 5, 6, 7, 8]);
      const scale = r.range(9, 22);
      const onLine = type === 3 || type === 6 || type === 1;

// ---- 40-engine.js
// ---------- the engine ----------
// Draws one world, the views through its two portals, and carries the viewer
// from one world into the next. The worlds themselves come from WORLD.make().
const ENG = {
  gl: null, canvas: null,
  cw: 2, ch: 2,            // canvas backing store
  rw: 2, rh: 2,            // size of the world pass (the plate is printed small, then enlarged)
  budget: 0.30e6,          // pixels in the world pass; the governor moves this
  budgetMax: 1.6e6, budgetMin: 0.1e6,
  quality: { steps: 96, reflect: 44, shadow: 26 },
  progs: new Map(),        // form name -> program, kept for the session
  badForms: new Set(),
  cur: null,               // the world we are in
  cand: [null, null],      // kin, stranger: the worlds behind the portals
  doors: null,             // { z, born, chosen, auto } once the portals are open
  look: { yaw: 0, pitch: 0, tyaw: 0, tpitch: 0, idle: 9 },
  camOff: [0, 0], roll: 0,
  fade: 0, fadeInk: [0, 0, 0],
  clock: 0, frame: 0, paused: false, gentle: false,
  journey: { seed: 1, step: 0, kinRun: 0, plates: [] },
  on: {},                  // callbacks: arrive(world), doors(open), choose(k), cross(world), fail(msg)
  stats: { fps: 0, ms: 0, compileMs: 0, px: 0, cost: 0 },
  errors: [],
  debug: 0, fixed: false,

  init(canvas) {
    const gl = GLX.init(canvas);
    if (!gl) return false;
    this.gl = gl; this.canvas = canvas;
    // one lattice of random bytes drives all noise; fixed seed so every device agrees
    const r = rngFrom(0x51ced), bytes = new Uint8Array(256 * 256 * 4);
    for (let i = 0; i < bytes.length; i++) bytes[i] = (r() * 256) | 0;
    this.noise = GLX.dataTexture(256, bytes, { linear: true });
    this.dummy = GLX.dataTexture(1, new Uint8Array([0, 0, 0, 255]), { linear: false });
    const head = '#version 300 es\n';
    this.post = {
      pre: GLX.program(head + GLSL['post/glowpre'], 'glowpre'),
      blur: GLX.program(head + GLSL['post/blur'], 'blur'),
      fin: GLX.program(head + GLSL['post/final'], 'final'),
    };
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); GLX.lost = true; if (this.on.lost) this.on.lost(); });
    canvas.addEventListener('webglcontextrestored', () => { GLX.lost = false; this.rebuild(); });
    return true;
  },

  // after a lost context every GL object is gone; worlds are rebuilt from their keys
  rebuild() {
    const keep = { cur: this.cur && this.cur.key, t: this.cur && this.cur.t, z: this.cur && this.cur.z };
    this.progs.clear(); this.tg = null;
    this.init(this.canvas); this.resize(true);
    if (keep.cur) { this.goTo(keep.cur, { quiet: true }); }

  },

  programFor(form) {
    let p = this.progs.get(form);
    if (!p) {
      const src = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n' +
        GLSL['a-head'] + '\n' + GLSL['forms/' + form] + '\n' + GLSL['z-main'];

  },
  compiling() { for (const p of this.progs.values()) if (p.state === 'compiling') return true; return false; },

  // ---- sizes ----
  resize(force) {
    const c = this.canvas;
    let cw, ch;
    if (this.fixed) { cw = c.width; ch = c.height; }
    else {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const box = c.getBoundingClientRect();
      cw = Math.max(2, Math.round(box.width * dpr)); ch = Math.max(2, Math.round(box.height * dpr));
      const cap = 3.7e6 / (cw * ch);
      if (cap < 1) { cw = Math.round(cw * Math.sqrt(cap)); ch = Math.round(ch * Math.sqrt(cap)); }
      if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    }
    const s = this.fixed ? 1 : Math.min(1, Math.sqrt(this.budget / (cw * ch)));
    const rw = Math.max(2, Math.round(cw * s / 2) * 2), rh = Math.max(2, Math.round(ch * s / 2) * 2);

      scene: GLX.target(rw, rh, o), p0: GLX.target(rw, rh, { hdr: false, linear: false }), p1: GLX.target(rw, rh, { hdr: false, linear: false }),

  },

  // ---- journeys ----
  makeRecord(key) {
    const g = WORLD.make(key);
    return { key, g, prog: this.programFor(g.form), t: 0, ta: 0, z: 0, warmed: false, live: null };
  },
  // Go straight to a world, with a fade. Used at the start, for jumps and after failures.
  goTo(key, opts = {}) {
    this.cur = this.makeRecord(key);

  },
  childKeys(w) {

    const kin = { base: k.base, change: mix32((k.change || 0) + 0x632be5ab + j.step) || 1, heir: k.heir, age: (k.age || 0) + 1, gen: (k.gen || 0) + 1 };

  },
  prepareCandidates() {
    const [kk, sk] = this.childKeys(this.cur);
    const kin = this.makeRecord(kk);
    let stranger = this.makeRecord(sk);
    // a stranger must not land on a form whose shader failed on this device
    let tries = 0;
    while (this.badForms.has(stranger.g.form) && tries++ < 12) { sk.base = mix32(sk.base + 977); stranger = this.makeRecord(sk); }
    this.cand = [kin, stranger];

  // ---- per frame ----
  step(dt) {
    const w = this.cur;

    const st = GLX.ready(w.prog);
    for (const p of this.progs.values()) {
      if (p.state === 'compiling') {
        GLX.ready(p);
        if (p.state === 'compiling' && performance.now() - p.started > 25000) { p.state = 'failed'; p.error = 'compile timed out'; }
      }

    if (st !== 'ready') return;
    if (!this.arrived) { this.arrived = true; if (this.on.arrive) this.on.arrive(w); }
    if (this.paused) dt = 0;

    const g = w.g;
    w.t += dt; w.ta += dt;
    for (const c of this.cand) if (c) c.t += dt;

    // candidates: made a few seconds in, opened when both shaders are ready
    if (!this.cand[0] && w.ta > 3) this.prepareCandidates();
    if (this.cand[0] && !this.doors) {

  },

  openDoors() {
    const w = this.cur, g = w.g;
    const ahead = g.speed * 15;
    const z = w.z + ahead;
    const p = WORLD.pathAt(g, z);
    const mk = (o) => ({ c: [p[0] + o[0], p[1] + o[1], z], r: g.door.r });
    // hands-off, the flight takes kin twice and then a stranger
    const auto = this.journey.kinRun >= 2 ? 1 : 0;

  stepDoors(dt) {
    const w = this.cur, g = w.g, D = this.doors;

    const cam = this.camera(w);
    for (let k = 0; k < 2; k++) {

      const facing = V.dot(to, cam.fwdUser);

  cross() {

    if (this.on.arrive) this.on.arrive(next);
  },

  failWorld(w) {
    this.badForms.add(w.g.form);
    this.errors.push('world ' + w.g.form + ': ' + (w.prog.error || 'failed'));

  },

  // ---- camera ----
  camera(w) {
    const g = w.g, z = w.z;

    const off = this.doors ? this.camOff : [this.camOff[0] * settle, this.camOff[1] * settle];
    const pos = [p[0] + off[0], p[1] + off[1], z];
    const lead = g.lead;
    const q = WORLD.pathAt(g, z + lead);

    const live = w.live || (w.live = WORLD.live(g, w.ta, w.t));
    if (g.set.type && g.set.attend > 0) {
      const sp = [live.set[0], live.set[1] + g.set.eye * g.set.scale, live.set[2]];
      const dz = sp[2] - z;
      const a = g.set.attend * smooth(g.speed * 16, g.speed * 9, dz) * smooth(g.set.scale * 1.2, g.set.scale * 5, dz);

      const dir = V.norm(V.sub(c, pos)), base = V.norm(V.sub(tgt, pos));

    }
    let f = V.norm(V.sub(tgt, pos));

    const L = this.look;
    const yaw = Math.atan2(f[0], f[2]) + L.yaw, pitch = Math.asin(clamp(f[1], -1, 1)) + L.pitch;

  },

  // ---- drawing ----
  setWorld(w, cam, { clip = null, doors = null, steps } = {}) {

    const live = w.live = WORLD.live(g, w.ta, w.t);
    GLX.use(w.prog);
    GLX.tex('uNoise', 0, this.noise);
    GLX.v2('uRes', this.rw, this.rh);
    GLX.v3('uCamP', cam.pos); GLX.v3('uCamR', cam.right); GLX.v3('uCamU', cam.up);
    GLX.v3('uCamF', V.mul(cam.fwdUser, cam.focal));

    GLX.v3('uSunDir', live.sunDir);
    GLX.v4('uSun', ...live.sun); GLX.v4('uAir', ...live.air); GLX.v4('uSea', ...live.sea);
    GLX.v4('uPathA', g.path.ax, g.path.fx, g.path.px, g.path.ay);
    GLX.v4('uPathB', g.path.fy, g.path.py, g.path.y0, 0);
    GLX.fv('uTr[0]', live.tr);
    GLX.v4('uSet', live.set[0], live.set[1], live.set[2], g.set.scale);
    GLX.v4('uSetK', g.set.type, g.set.yaw, live.setMotion, live.setLit);
    GLX.v4('uEv', live.ev, g.ev.id, 0, 0);
    GLX.v4('uSky', ...live.sky);

    gl.uniform4fv(GLX.loc('uBodyK[0]') || null, live.bodyK);

        pn.set([0, 0, 1, doors.open * (0.9 + 0.1 * Math.sin(w.t * 0.7 + k * 2))], k * 4);

    gl.uniform4fv(GLX.loc('uPortN[0]') || null, pn);

    GLX.v4('uQ', steps || q.steps, q.reflect, q.shadow, this.debug);
  },

  // screen rectangle that contains a portal, in pixels of the world pass; null when off screen
  doorRect(cam, d, open) {
    const R = d.r * open * 1.06;
    if (R <= 0.01) return null;
    const v = V.sub(d.c, cam.pos);
    const depth = V.dot(v, cam.fwdUser);
    if (V.len(v) < R * 2.2) return [0, 0, this.rw, this.rh];
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU, p = [v[0] + Math.cos(a) * R * 1.09, v[1] + Math.sin(a) * R * 1.09, v[2]];
      const zc = V.dot(p, cam.fwdUser);
      if (zc < 0.2) { if (depth < 0) return null; return [0, 0, this.rw, this.rh]; }
      const x = (V.dot(p, cam.right) * cam.focal / zc) * this.rh / 2 + this.rw / 2;
      const y = (V.dot(p, cam.up) * cam.focal / zc) * this.rh / 2 + this.rh / 2;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    x0 = Math.max(0, Math.floor(x0) - 2); y0 = Math.max(0, Math.floor(y0) - 2);
    x1 = Math.min(this.rw, Math.ceil(x1) + 2); y1 = Math.min(this.rh, Math.ceil(y1) + 2);
    if (x1 <= x0 || y1 <= y0) return null;
    return [x0, y0, x1 - x0, y1 - y0];
  },

  render() {
    const gl = this.gl, w = this.cur;
    if (!w || w.prog.state !== 'ready' || GLX.lost) return false;
    for (const k in this.post) if (GLX.ready(this.post[k]) !== 'ready') return false;
    const cam = this.camera(w), D = this.doors;
    // 1. what lies through each portal, only where the portal is on screen
    if (D) {
      for (let k = 0; k < 2; k++) {
        const c = this.cand[k], rect = this.doorRect(cam, D.d[k], D.open);
        if (!c || !rect) continue;
        const E = WORLD.pathAt(c.g, 0), C = D.d[k].c;
        const camB = { ...cam, pos: [cam.pos[0] - C[0] + E[0], cam.pos[1] - C[1] + E[1], cam.pos[2] - C[2]] };
        const far = rect[2] * rect[3] < this.rw * this.rh * 0.04;
        this.setWorld(c, camB, { clip: [0, 0, 1, 0], steps: far ? Math.round(this.quality.steps * 0.6) : 0 });
        GLX.draw(k ? this.tg.p1 : this.tg.p0, this.rw, this.rh, rect);
      }
    }
    // 2. the world itself
    this.setWorld(w, cam, { doors: D });

    const ga = this.tg.ga, gb = this.tg.gb;

      GLX.tex('uSrc', 0, ga.tex); GLX.v2('uTexel', 1 / ga.w, 1 / ga.h); GLX.v2('uDir', 1 + i, 0); GLX.draw(gb, gb.w, gb.h);
      GLX.tex('uSrc', 0, gb.tex); GLX.v2('uDir', 0, 1 + i); GLX.draw(ga, ga.w, ga.h);
    }
    // 4. to the screen
    GLX.use(this.post.fin);
    GLX.tex('uSrc', 0, this.tg.scene.tex); GLX.tex('uGlow', 1, ga.tex); GLX.tex('uNoise', 2, this.noise);
    GLX.v2('uOut', this.cw, this.ch);
    GLX.v4('uK', 0.9, this.debug ? 0 : 0.05, this.fixed ? 1 : this.fade, 0);
    GLX.v3('uFadeInk', w.g.inks.paper);
    GLX.draw(null, this.cw, this.ch);
    return true;
  },

  // ---- the governor: holds the frame rate by changing how many pixels are marched ----
  gov: { acc: 0, n: 0, hold: 0, wait: 2, lastUp: 0, floor: 1 / 60, seen: [] },
  govern(dt) {
    const G = this.gov;
    if (this.fixed || this.paused || this.compiling() || dt > 0.5) { G.acc = 0; G.n = 0; return; }
    G.acc += dt; G.n++;
    if (G.acc < 0.8) return;
    const avg = G.acc / G.n; G.acc = 0; G.n = 0;
    // learn the display's own frame time from the fastest window seen
    G.seen.push(avg); if (G.seen.length > 40) G.seen.shift();
    G.floor = Math.max(1 / 144, Math.min(...G.seen, 1 / 30));
    this.stats.fps = 1 / avg;
    const target = Math.max(G.floor * 1.12, 1 / 58);
    if (avg > target * 1.18) {
      this.budget = Math.max(this.budgetMin, this.budget * (avg > target * 1.8 ? 0.6 : 0.82));
      G.hold = 0; G.wait = Math.min(G.wait * 1.6, 40);
      this.resize();
    } else if (avg < target * 1.04) {
      G.hold += 0.8;
      if (G.hold >= G.wait && this.budget < this.budgetMax && this.rw < this.cw) {
        this.budget = Math.min(this.budgetMax, this.budget * 1.15); G.hold = 0; this.resize();
      }
    } else G.hold = 0;
  },
};

// ---- 90-main.js
// ---------- start ----------
const Q = new URLSearchParams(location.search);
const qn = (k, d) => (Q.has(k) && Number.isFinite(+Q.get(k)) ? +Q.get(k) : d);
const $ = (id) => document.getElementById(id);

function boot() {
  const canvas = $('view');
  const shot = Q.has('shot');
  if (shot) {
    // deterministic stills for the test harness: fixed size, no clock but ours
    document.body.classList.add('bleed');
    canvas.width = qn('w', 640); canvas.height = qn('h', 360);
    canvas.style.cssText = `position:fixed;left:0;top:0;width:${canvas.width}px;height:${canvas.height}px`;
    ENG.fixed = true;
  }
  if (!ENG.init(canvas)) { $('veil-sub').textContent = 'this browser cannot draw the worlds (WebGL 2 is missing)'; window.__ks = { error: 'nowebgl2' }; return; }
  ENG.debug = qn('debug', 0);
  if (Q.has('steps')) ENG.quality.steps = qn('steps', 96);
  ENG.resize(true);
  const seed = Q.has('seed') ? (codeToSeed(Q.get('seed')) ?? 1) : (Math.random() * 4294967296) >>> 0;
  ENG.journey.seed = qn('journey', seed);
  const key = { base: seed, change: qn('change', 0) >>> 0, heir: seed, age: 0, gen: 0 };
  if (Q.has('form')) key.form = Q.get('form');
  if (Q.has('pal')) key.pal = Q.get('pal');
  ENG.goTo(key);

  ENG.on.arrive = (w) => { $('veil').classList.add('gone'); };
  window.addEventListener('resize', () => ENG.resize());

  if (shot) {
    // window.__ks: stepTo(seconds) simulates with a fixed step and draws one frame
    const hooks = window.__ks = {
      ready: false, errors: ENG.errors,
      async wait() {
        for (let i = 0; i < 3000; i++) {
          ENG.step(0);
          if (ENG.cur && ENG.cur.prog.state === 'ready' && ENG.render()) { hooks.ready = true; return true; }
          if (!ENG.cur) return false;
          await new Promise((r) => setTimeout(r, 10));
        }
        return false;
      },
      stepTo(t, dt = 1 / 20) {
        while (ENG.cur && ENG.cur.ta + ENG.journeyClockOffset() < t - 1e-6) ENG.step(Math.min(dt, t - ENG.cur.ta - ENG.journeyClockOffset()));
        return ENG.render();
      },
      advance(sec, dt = 1 / 20) { for (let t = 0; t < sec - 1e-6; t += dt) ENG.step(dt); return ENG.render(); },
      draw() { return ENG.render(); },
      look(yaw, pitch) { ENG.look.tyaw = ENG.look.yaw = yaw; ENG.look.tpitch = ENG.look.pitch = pitch; ENG.look.idle = 0; },
      info() {
        const w = ENG.cur; if (!w) return null;
        return { form: w.g.form, pal: w.g.pal.name, ta: w.ta, z: w.z, doors: !!ENG.doors, step: ENG.journey.step, key: w.key, name: w.g.name, line: w.g.line, set: w.g.set.type, ev: w.g.ev.type,
          cands: ENG.cand.map((c) => c && { form: c.g.form, pal: c.g.pal.name, state: c.prog.state }), rw: ENG.rw, rh: ENG.rh, compile: w.prog.compileMs };
      },
      // mean and max of the red channel: with ?debug=1 that is march cost / 200
      pixels() {
        const gl = ENG.gl, w = canvas.width, h = canvas.height, px = new Uint8Array(w * h * 4);
        ENG.render(); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
        let r = 0, g = 0, b = 0, mx = 0, black = 0, over = 0;
        for (let i = 0; i < px.length; i += 4) { r += px[i]; g += px[i + 1]; b += px[i + 2]; mx = Math.max(mx, px[i]); if (px[i] + px[i + 1] + px[i + 2] < 6) black++; if (px[i + 1] > 250 && px[i] < 5) over++; }
        const n = w * h;
        return { r: r / n, g: g / n, b: b / n, max: mx, black: black / n, over: over / n };
      },
    };
    ENG.journeyClockOffset = () => 0;
    hooks.wait();
    return;
  }

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    ENG.step(dt); ENG.render(); ENG.govern(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
window.addEventListener('error', (e) => { ENG.errors.push(String(e.message)); });
boot();

})();
</script>
